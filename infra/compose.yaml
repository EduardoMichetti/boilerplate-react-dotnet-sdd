# Uma instalação (tenant) por projeto Compose: use --project-name distinto e um
# --env-file privado por instalação (ex.: boilerplate-a + infra/.env.local).
# Volumes e redes são nomeados por projeto; não há container_name nem nomes globais.
# Cada serviço recebe somente a própria credencial (G4/G16).
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    # Sem publicação de porta. Depuração opcional, só no loopback:
    #   -f infra/compose.yaml -f infra/compose.depuracao.yaml
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SENHA_SUPERUSUARIO_POSTGRES:?defina SENHA_SUPERUSUARIO_POSTGRES no env privado}
      PGDATA: /var/lib/postgresql/data/pgdata
      BANCO_APP: ${BANCO_APP:?defina BANCO_APP no env privado}
      SENHA_OWNER: ${SENHA_OWNER:?defina SENHA_OWNER no env privado}
      SENHA_RUNTIME: ${SENHA_RUNTIME:?defina SENHA_RUNTIME no env privado}
      LOGIN_OPERADOR_ACESSO: ${LOGIN_OPERADOR_ACESSO:?defina LOGIN_OPERADOR_ACESSO no env privado}
      SENHA_OPERADOR_ACESSO: ${SENHA_OPERADOR_ACESSO:?defina SENHA_OPERADOR_ACESSO no env privado}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    # Development HTTP é permitido somente com publicação no loopback do host.
    ports:
      - "127.0.0.1:${PORTA_API:?defina PORTA_API no env privado}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      CodigoAplicacao: ${CodigoAplicacao:?defina CodigoAplicacao no env privado}
      IdAmbiente: ${IdAmbiente:?defina IdAmbiente no env privado}
      IdTenant: ${IdTenant:?defina IdTenant no env privado}
      NomeExibicaoTenant: ${NomeExibicaoTenant:?defina NomeExibicaoTenant no env privado}
      EstadoTenant: ${EstadoTenant:?defina EstadoTenant no env privado}
      StringsConexao__BancoApp: Host=postgres;Port=5432;Database=${BANCO_APP};Username=${BANCO_APP}_runtime;Password=${SENHA_RUNTIME}
      # Opcional: vazio equivale a ausente (padrão 30), G10.
      Sessao__PrazoAbsolutoMinutos: ${Sessao__PrazoAbsolutoMinutos:-}
      ProtecaoDados__DiretorioChaves: /var/lib/bps/chaves
    volumes:
      - chaves_protecao_dados:/var/lib/bps/chaves

  migrations:
    profiles:
      - migrations
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CodigoAplicacao: ${CodigoAplicacao:?defina CodigoAplicacao no env privado}
      IdAmbiente: ${IdAmbiente:?defina IdAmbiente no env privado}
      IdTenant: ${IdTenant:?defina IdTenant no env privado}
      NomeExibicaoTenant: ${NomeExibicaoTenant:?defina NomeExibicaoTenant no env privado}
      EstadoTenant: ${EstadoTenant:?defina EstadoTenant no env privado}
      StringsConexao__BancoApp: Host=postgres;Port=5432;Database=${BANCO_APP};Username=${BANCO_APP}_owner;Password=${SENHA_OWNER}
      Migracoes__PermitirInicializarBancoVazio: ${Migracoes__PermitirInicializarBancoVazio:-false}

  operations:
    profiles:
      - operations
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.operations
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CodigoAplicacao: ${CodigoAplicacao:?defina CodigoAplicacao no env privado}
      IdAmbiente: ${IdAmbiente:?defina IdAmbiente no env privado}
      IdTenant: ${IdTenant:?defina IdTenant no env privado}
      NomeExibicaoTenant: ${NomeExibicaoTenant:?defina NomeExibicaoTenant no env privado}
      EstadoTenant: ${EstadoTenant:?defina EstadoTenant no env privado}
      StringsConexao__BancoApp: Host=postgres;Port=5432;Database=${BANCO_APP};Username=${LOGIN_OPERADOR_ACESSO};Password=${SENHA_OPERADOR_ACESSO}
      OperacaoAcesso__LoginAutorizado: ${LOGIN_OPERADOR_ACESSO:?defina LOGIN_OPERADOR_ACESSO no env privado}
      # Opcional: vazio equivale a ausente (padrão 30), G10.
      OperacaoAcesso__RetencaoSessoesDias: ${OperacaoAcesso__RetencaoSessoesDias:-}

volumes:
  dados_postgres:
  chaves_protecao_dados:
