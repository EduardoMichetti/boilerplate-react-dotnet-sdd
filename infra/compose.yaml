services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ApplicationId: ${ApplicationId}
      EnvironmentId: ${EnvironmentId}
      TenantId: ${TenantId}
      TenantDisplayName: ${TenantDisplayName}
      TenantState: ${TenantState}
      ConnectionStrings__AppDb: ${ConnectionStrings__AppDb}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

  migrations:
    profiles:
      - migrations
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ApplicationId: ${ApplicationId}
      EnvironmentId: ${EnvironmentId}
      TenantId: ${TenantId}
      TenantDisplayName: ${TenantDisplayName}
      TenantState: ${TenantState}
      ConnectionStrings__AppDb: ${ConnectionStrings__AppDbOwner}
      Migrations__AllowInitializeEmptyDatabase: ${Migrations__AllowInitializeEmptyDatabase:-false}

volumes:
  dados_postgres:
