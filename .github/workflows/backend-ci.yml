name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Format, Test & Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies in locked mode
        run: dotnet restore backend/Boilerplate.slnx --locked-mode

      - name: Build solution
        run: dotnet build backend/Boilerplate.slnx --no-restore

      - name: Verify code formatting
        run: dotnet format backend/Boilerplate.slnx --verify-no-changes --no-restore

      - name: Run tests with Testcontainers
        run: dotnet test backend/Boilerplate.slnx --no-restore --minimum-expected-tests 1

      - name: NuGet Vulnerability Audit
        shell: bash
        run: |
          echo "Executando auditoria de pacotes NuGet vulneráveis..."
          REPORT=$(dotnet package list backend/Boilerplate.slnx --vulnerable --include-transitive --format json)
          echo "$REPORT"
          
          # Bloqueia se contiver achados com severidade High ou Critical
          CRITICAL_COUNT=$(echo "$REPORT" | grep -iE '"severity":\s*"(Critical|High)"' | wc -l || true)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Foram encontradas $CRITICAL_COUNT vulnerabilidades de severidade Alta ou Crítica nas dependências NuGet."
            exit 1
          fi
          echo "Nenhuma vulnerabilidade Alta ou Crítica encontrada nas dependências."

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
