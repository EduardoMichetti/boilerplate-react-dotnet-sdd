name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Format, Test & Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies in locked mode
        run: dotnet restore backend/Boilerplate.slnx --locked-mode

      - name: Build solution
        run: dotnet build backend/Boilerplate.slnx --no-restore

      - name: Verify code formatting
        run: dotnet format backend/Boilerplate.slnx --verify-no-changes --no-restore

      # Inclui App.Api, Platform.Operations e as três suítes (todas listadas na solution).
      - name: Run tests with Testcontainers
        run: dotnet test --solution backend/Boilerplate.slnx --no-restore --minimum-expected-tests 1

      # Valida o Compose com valores fictícios gerados nesta execução (nunca versionados).
      # O exemplo versionado sozinho DEVE falhar: não contém segredo utilizável.
      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          ENV_CI="$RUNNER_TEMP/compose-ci.env"
          gerar() { openssl rand -hex 24; }
          umask 077
          {
            echo "CodigoAplicacao=boilerplate-ci"
            echo "IdAmbiente=$(cat /proc/sys/kernel/random/uuid)"
            echo "IdTenant=$(cat /proc/sys/kernel/random/uuid)"
            echo "NomeExibicaoTenant=Instalacao CI"
            echo "EstadoTenant=Inativo"
            echo "PORTA_API=18080"
            echo "BANCO_APP=appdb_ci"
            echo "SENHA_SUPERUSUARIO_POSTGRES=$(gerar)"
            echo "SENHA_OWNER=$(gerar)"
            echo "SENHA_RUNTIME=$(gerar)"
            echo "LOGIN_OPERADOR_ACESSO=appdb_ci_op_ci"
            echo "SENHA_OPERADOR_ACESSO=$(gerar)"
            echo "PORTA_POSTGRES_DEPURACAO=15432"
          } > "$ENV_CI"
          docker compose -f infra/compose.yaml --env-file "$ENV_CI" --profile migrations --profile operations config --quiet
          docker compose -f infra/compose.yaml -f infra/compose.depuracao.yaml --env-file "$ENV_CI" config --quiet
          if docker compose -f infra/compose.yaml --env-file infra/.env.example config --quiet 2>/dev/null; then
            echo "::error::infra/.env.example sozinho não deveria produzir configuração válida."
            exit 1
          fi
          rm -f "$ENV_CI"
          echo "Compose validado (A com perfis migrations/operations e override de depuração)."

      - name: NuGet Vulnerability Audit
        shell: bash
        run: |
          echo "Executando auditoria de pacotes NuGet vulneráveis..."
          # SDK 10: a solução vai em --project (o argumento posicional é rejeitado).
          REPORT=$(dotnet package list --project backend/Boilerplate.slnx --vulnerable --include-transitive --format json)
          echo "$REPORT"

          # Scan inconclusivo nunca aprova: exige JSON válido com a lista de projetos.
          if ! echo "$REPORT" | jq -e '.projects | length > 0' > /dev/null; then
            echo "::error::Relatório de vulnerabilidades ausente ou inválido; auditoria inconclusiva."
            exit 1
          fi

          # Bloqueia se contiver achados com severidade High ou Critical
          CRITICAL_COUNT=$(echo "$REPORT" | grep -iE '"severity":\s*"(Critical|High)"' | wc -l || true)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Foram encontradas $CRITICAL_COUNT vulnerabilidades de severidade Alta ou Crítica nas dependências NuGet."
            exit 1
          fi
          echo "Nenhuma vulnerabilidade Alta ou Crítica encontrada nas dependências."

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
